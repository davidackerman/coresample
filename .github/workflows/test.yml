name: Tests

# The page's type check and unit tests (web/test/*.test.ts: the search on made-up sources,
# readers on local fixtures; no network) on every pull request and push to main. pages.yml runs
# them too before it deploys.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # chunkmirage's browser pieces at the commit web/chunkmirage.lock pins; they import
      # onnxruntime-web, found through this package's node_modules
      - name: Fetch chunkmirage (web/chunkmirage.lock)
        run: |
          git clone -q https://github.com/JaneliaSciComp/chunkmirage ../chunkmirage
          git -C ../chunkmirage checkout -q "$(cat web/chunkmirage.lock)"
      - name: Type check and tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          ln -s "$PWD/node_modules" ../../chunkmirage/web/node_modules
          npx tsc --noEmit
          npm test
