[project]
name = "coresample"
version = "0.0.0"
description = "Feasibility tests: search multiscale array datasets for regions like this one, with no precomputation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "tensorstore",
    "matplotlib",
    "scikit-learn",
    "torch",
    "transformers",
    "pillow",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
