[project]
name = "coresample"
version = "0.0.0"
description = "Search multiscale array datasets for regions like this one, with no precomputation: the Python experiments and command-line search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "tensorstore",
    "matplotlib",
    "scikit-learn",
    "torch",
    "transformers",
    "pillow",
    "scikit-image>=0.26.0",
    "torchvision>=0.29.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]
